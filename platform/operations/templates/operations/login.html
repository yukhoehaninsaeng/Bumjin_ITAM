{% load static %}<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUMJIN IT 로그인</title><link rel="stylesheet" href="{% static 'operations/workspace.css' %}"></head><body class="loginBody"><main class="loginCard"><b class="loginBrand">BUMJIN IT</b><h1>워크스페이스 로그인</h1><p>내 자산과 지원 요청을 확인하세요.</p>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.GET.next }}"><label>아이디<input name="username" required maxlength="128" autocomplete="username" autofocus></label><label>비밀번호<input name="password" type="password" required maxlength="256" autocomplete="current-password"></label><button class="loginButton">로그인</button></form><small>권한에 따라 관리자 또는 직원 화면으로 이동합니다.</small></main></body></html>
