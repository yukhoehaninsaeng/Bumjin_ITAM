{% load static %}<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="csrf-token" content="{{ csrf_token }}"><title>NAS 비밀번호 재설정 · BUMJIN</title><link rel="stylesheet" href="{% static 'operations/workspace.css' %}?v=20261116-recovery"></head>
<body class="loginBody"><header class="loginHeader"><div class="loginBrand"><b>BUMJIN</b><span aria-hidden="true"></span><strong>NAS 계정</strong></div></header>
<main class="loginFormShell"><h1 id="recoveryTitle">비밀번호를 잊으셨나요?</h1><p id="recoveryHelp" class="loginSubtitle">NAS 계정과 등록된 회사 이메일을 입력하세요. 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>
<form id="recoveryRequest"><div class="loginField"><label for="account">계정 ID</label><input id="account" name="account" required maxlength="128" autocomplete="username"></div><div class="loginField"><label for="email">회사 이메일</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"></div><button class="loginButton" type="submit">재설정 링크 받기</button></form>
<form id="recoveryComplete" hidden><div class="loginField"><label for="password">새 비밀번호 (12자 이상)</label><input id="password" type="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password"></div><div class="loginField"><label for="confirmPassword">새 비밀번호 확인</label><input id="confirmPassword" type="password" name="confirm_password" required maxlength="128" autocomplete="new-password"></div><button class="loginButton" type="submit">NAS 비밀번호 재설정</button></form>
<p id="recoveryStatus" role="status" aria-live="polite"></p><p><a href="/login">로그인 화면으로</a></p><section class="loginGuide"><h2>메일을 받을 수 없나요?</h2><p>등록된 회사 이메일에 접근할 수 없거나 LDAP 계정이 연결되지 않았다면 IT 관리자에게 비밀번호 초기화를 요청하세요.</p></section></main><script src="{% static 'operations/password_recovery.js' %}?v=20261116-recovery" defer></script></body></html>
