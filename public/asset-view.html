<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자산 조회 | BUMJIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#182230;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}header{background:white;border-bottom:1px solid #e6eaf0;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}header img{width:150px;height:36px;object-fit:contain}main{max-width:880px;margin:32px auto;padding:0 20px 40px}.eyebrow{color:#a91b3a;font-size:12px;font-weight:700;letter-spacing:1px}h1{font-size:30px;line-height:1.3;margin:10px 0 4px;overflow-wrap:anywhere}h2{font-size:17px;margin:0 0 16px}.muted{color:#667085}.card{background:white;border:1px solid #e4e8ef;border-radius:18px;padding:24px;margin-top:20px;box-shadow:0 5px 18px #18223004}.owner{background:#fff7fa;border-color:#f4d4de}.ownerName{font-size:26px;font-weight:750;overflow-wrap:anywhere}.pill{display:inline-block;border-radius:20px;padding:3px 12px;font-size:12px;background:#edf2f6;color:#344054;margin-top:12px}.kv{display:grid;grid-template-columns:115px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid #edf0f4}.kv:last-child{border:0}.kv span{color:#667085}.kv b{font-weight:600;overflow-wrap:anywhere}button,.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid #dce1e9;border-radius:9px;background:white;padding:11px 16px;color:#344054;text-decoration:none;font:inherit;cursor:pointer}.primary{background:#dd254c;border-color:#dd254c;color:white}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.footer{font-size:12px;color:#667085;margin-top:24px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}input{min-width:0;flex:1;border:1px solid #dce1e9;border-radius:9px;padding:12px;font:inherit}.assetList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.assetLink{display:block;text-decoration:none;color:inherit;background:white;border:1px solid #e4e8ef;border-radius:14px;padding:18px}.assetLink b{display:block;font-size:18px;overflow-wrap:anywhere}.assetLink p{margin:5px 0;overflow-wrap:anywhere}.error{color:#b42318}button:focus-visible,a:focus-visible{outline:3px solid #efadc0;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){header{padding:14px 18px}header img{width:125px}main{margin:22px auto;padding:0 16px 28px}.card{padding:20px}.assetList{grid-template-columns:1fr}h1{font-size:26px}.kv{grid-template-columns:90px minmax(0,1fr)}}
</style></head><body><header><img src="/login-logo.svg" alt="BUMJIN"><span class="pill" style="margin:0">조회 전용</span></header><main><div class="eyebrow">BUMJIN IT ASSETS</div><h1 id="title">자산 정보</h1><p id="subtitle" class="muted">정보를 불러오는 중입니다.</p><p id="message" role="status"></p><div id="content"></div><div id="actions" class="actions"></div><div class="footer">자산 정보 변경이 필요하면 전산 담당자에게 문의하세요.</div></main>
<script src="/vendor/jsQR.js"></script><script src="/qr-scanner.js"></script><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let identity=null,allAssets=[];const id=location.pathname.startsWith('/a/')?location.pathname.slice(3):'';
async function read(url){const response=await fetch(url,{cache:'no-store'}),body=await response.json();if(!response.ok)throw Error(body.error||'정보를 불러오지 못했습니다.');return body}
function renderAsset(a){$('title').textContent=a.number;$('subtitle').textContent=[a.division,a.category,a.model].filter(Boolean).join(' · ');const monitor=a.category==='모니터';const details=[['장비 구분',a.category],['모델',[a.maker,a.model].filter(Boolean).join(' ')],...(monitor?[['화면 크기',a.size?a.size+' 인치':'']]:[['CPU',a.cpu],['RAM',a.ram],['SSD / HDD',[a.ssd||'—',a.hdd||'—'].join(' / ')],['그래픽',a.gpu],['OS',[a.os,a.edition].filter(Boolean).join(' ')]]),[a.date_label||'구입일',a.date],['상태',a.status]];
$('content').innerHTML='<section class="card owner"><h2>현재 사용자</h2><div class="ownerName">'+esc(a.user)+'</div><div class="muted">'+esc(a.department||'부서 미등록')+'</div><span class="pill">'+esc(a.status||'상태 미등록')+'</span></section><section class="card"><h2>장비 정보</h2>'+details.map(([label,value])=>'<div class="kv"><span>'+esc(label)+'</span><b>'+esc(value||'미등록')+'</b></div>').join('')+'</section>'}
function renderList(){const q=$('search').value.trim().toLowerCase(),items=allAssets.filter(a=>[a.number,a.user,a.department,a.model,a.category,a.division].join(' ').toLowerCase().includes(q));$('count').textContent=items.length+'개 자산';$('list').innerHTML=items.map(a=>'<a class="assetLink" href="/a/'+encodeURIComponent(a.id)+'"><b>'+esc(a.number)+'</b><p>'+esc(a.user)+' · '+esc(a.department||'부서 미등록')+'</p><small class="muted">'+esc([a.category,a.model,a.status].filter(Boolean).join(' · '))+'</small></a>').join('')||'<p class="muted">검색 결과가 없습니다.</p>'}
async function logout(){try{await readLogout();location.replace('/login')}catch(e){$('message').textContent=e.message}}
async function readLogout(){const r=await fetch('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':identity.csrf},body:'{}'});if(!r.ok)throw Error('로그아웃하지 못했습니다.')}
(async()=>{try{try{const r=await fetch('/api/auth/me',{cache:'no-store'});if(r.ok)identity=await r.json()}catch(_){}
if(id){const body=await read('/api/public/assets/'+encodeURIComponent(id));renderAsset(body.asset);$('actions').innerHTML=identity?.role==='admin'?'<a class="button primary" href="/manage/a/'+encodeURIComponent(id)+'">관리자 모드로 관리</a>':'<a class="button" href="/login?next='+encodeURIComponent('/manage/a/'+id)+'">관리자 로그인</a>';if(identity)$('actions').innerHTML+='<a class="button" href="/">자산 목록</a>'}
else{if(!identity){location.replace('/login');return}$('title').textContent='자산 조회';$('subtitle').textContent='사용자와 장비 정보를 검색하거나 QR로 확인하세요.';$('content').innerHTML='<div class="toolbar"><input id="search" placeholder="관리번호, 이름, 부서, 모델 검색" aria-label="자산 검색"><button id="scan">QR 스캔</button></div><p id="count" class="muted"></p><div id="list" class="assetList"></div>';$('scan').onclick=()=>BumjinScanner.open({manage:identity.role==='admin'});allAssets=(await read('/api/view/assets')).assets;renderList();$('search').oninput=renderList;$('actions').innerHTML='<button id="logout">로그아웃</button>';$('logout').onclick=logout}
}catch(e){$('subtitle').textContent='';$('message').className='error';$('message').textContent=e.message}})();
</script></body></html>
