<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>로그인 | BUMJIN 자산관리</title>
<style>*{box-sizing:border-box}:root{font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#24262b;background:#fff}body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#fff}button,input{font:inherit}.loginHeader{height:80px;flex:0 0 80px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid #e2e4e8}.loginBrand{display:flex;align-items:center;gap:20px}.loginBrand b{font-size:22px;letter-spacing:.2px;color:#dd254c}.loginBrand span{height:20px;border-left:1px solid #e2e4e8}.loginBrand strong{font-size:15px;font-weight:500}.loginHeader>span{color:#606773;font-size:12px}.loginFormShell{width:min(400px,calc(100% - 36px));min-height:620px;margin:138px auto 70px}.loginFormShell h1{font-size:28px;line-height:42px;letter-spacing:-.4px;margin:0 0 8px;font-weight:700}.loginSubtitle{color:#606773;font-size:15px;line-height:23px;margin:0 0 40px}.loginFormShell form{margin:0}.loginField{display:block;margin:0 0 22px}.loginField>span{display:block;margin:0 0 12px;font-size:14px;font-weight:500}.loginField input{width:100%;height:48px;padding:0 14px;border:1px solid #e2e4e8;border-radius:4px;background:#fff;color:#24262b;font-size:14px;outline:none}.loginField input::placeholder{color:#757d89}.loginField input:focus{border-color:#dd254c;box-shadow:0 0 0 2px #dd254c1a}.passwordControl{position:relative}.passwordControl input{padding-right:64px}.reveal{position:absolute;top:7px;right:8px;height:34px;padding:0 6px;border:0;border-radius:3px;background:transparent;color:#606773;font-size:12px;cursor:pointer}.reveal:hover{background:#f7f8fa}.loginButton{width:100%;height:48px;margin:3px 0 36px;border:1px solid #dd254c;border-radius:4px;background:#dd254c;color:#fff;font-size:14px;font-weight:600;cursor:pointer}.loginButton:hover{background:#c41d40}.loginButton:disabled{opacity:.55;cursor:wait}.loginGuide{border-top:1px solid #e2e4e8;padding-top:18px}.loginGuide h2{margin:0 0 12px;font-size:13px;font-weight:600}.loginGuide p{margin:0;color:#606773;font-size:12px;line-height:1.7}.loginError{margin:0 0 14px;padding:10px 12px;border:1px solid #f4c9d2;border-radius:4px;background:#fff5f7;color:#a71c39;font-size:13px;line-height:1.5;overflow-wrap:anywhere}.loginFooter{min-height:92px;margin-top:auto;border-top:1px solid #e2e4e8;padding:23px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}.loginFooter strong{font-size:12px;font-weight:500;color:#606773}.loginFooter p{margin:7px 0 0;color:#606773;font-size:12px}.loginFooter>span{color:#606773;font-size:12px}[hidden]{display:none!important}button:focus-visible{outline:2px solid #dd254c;outline-offset:2px}@media(max-width:600px){.loginHeader{height:64px;flex-basis:64px;padding:0 18px}.loginBrand{gap:12px}.loginBrand b{font-size:19px}.loginBrand strong{font-size:13px}.loginHeader>span{font-size:11px}.loginFormShell{min-height:0;margin:70px auto 64px}.loginFormShell h1{font-size:24px;line-height:1.4}.loginSubtitle{margin-bottom:32px}.loginFooter{padding:20px 18px;align-items:flex-start;flex-direction:column;gap:12px}.loginFooter>span{font-size:11px}}@media(max-height:800px) and (min-width:601px){.loginFormShell{margin-top:70px;margin-bottom:48px;min-height:540px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style>
</head>
<body>
<header class="loginHeader"><div class="loginBrand"><b>BUMJIN</b><span aria-hidden="true"></span><strong>IT 자산관리</strong></div><span>사내 업무 시스템</span></header><main class="loginFormShell" aria-labelledby="loginTitle"><h1 id="loginTitle">IT 자산관리 로그인</h1><p class="loginSubtitle">회사 계정으로 자산 정보를 확인하세요.</p><form id="loginForm"><label class="loginField" for="username"><span>아이디</span><input id="username" name="username" placeholder="LDAP 아이디 입력" autocomplete="username" maxlength="128" required autofocus></label><label class="loginField" for="password"><span>비밀번호</span><div class="passwordControl"><input id="password" name="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" maxlength="256" required><button type="button" id="revealPassword" class="reveal" aria-label="비밀번호 표시" aria-pressed="false">보기</button></div></label><p id="loginError" class="loginError" role="alert" hidden></p><button class="loginButton" id="loginButton" type="submit" disabled>로그인</button></form><section class="loginGuide"><h2>계정 안내</h2><p>일반 직원은 LDAP 계정으로 로그인하며,<br>자산 조회만 이용할 수 있습니다.<br>관리자는 admin 계정으로 로그인하세요.</p></section></main><footer class="loginFooter"><div><strong>BUMJIN IT Asset Management</strong><p>자산 · 사용자 · 소프트웨어 통합 관리</p></div><span>사내 계정으로만 이용할 수 있습니다.</span></footer>
<script>
const form=document.getElementById('loginForm'),button=document.getElementById('loginButton'),error=document.getElementById('loginError'),password=document.getElementById('password'),reveal=document.getElementById('revealPassword');let loginCsrf='';
function showError(message){error.textContent=message;error.hidden=false}
async function prepareLogin(){const r=await fetch('/api/auth/csrf',{cache:'no-store'});const result=await r.json();if(!r.ok)throw Error(result.error||'로그인 화면을 준비하지 못했습니다.');loginCsrf=result.csrf}
reveal.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';reveal.textContent=show?'숨기기':'보기';reveal.setAttribute('aria-label',show?'비밀번호 숨기기':'비밀번호 표시');reveal.setAttribute('aria-pressed',String(show))};
form.onsubmit=async e=>{e.preventDefault();if(button.disabled)return;button.disabled=true;button.textContent='로그인 중…';error.hidden=true;try{if(!loginCsrf)await prepareLogin();const username=document.getElementById('username').value.trim(),secret=password.value;const next=new URLSearchParams(location.search).get('next')||'/';document.getElementById('username').disabled=true;password.disabled=true;reveal.disabled=true;const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':loginCsrf},body:JSON.stringify({username,password:secret,next})});const result=await r.json();if(!r.ok){if(r.status===403){loginCsrf='';await prepareLogin()}throw Error(result.error||'로그인하지 못했습니다.')}password.value='';location.replace(result.next||'/')}catch(e){showError(e.message||'서버에 연결하지 못했습니다. 다시 시도하세요.')}finally{button.disabled=false;button.textContent='로그인';document.getElementById('username').disabled=false;password.disabled=false;reveal.disabled=false}};
prepareLogin().catch(e=>showError(e.message)).finally(()=>{button.disabled=false});
</script>
</body></html>
